{% extends 'filmes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-danger mb-3 shadow-lg">
            <div class="card-header bg-danger text-white fw-bold">
                <i class="fa-solid fa-triangle-exclamation"></i> Confirmar Exclusão
            </div>
            <div class="card-body">
                <h5 class="card-title text-light">Tem certeza que deseja remover este filme?</h5>
                <p class="card-text text-muted">Você está prestes a excluir o filme <strong>"{{ filme.titulo }}"</strong>. Esta ação não poderá ser desfeita.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'listar_filmes' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sim, Excluir Filme</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
